<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Student Attendance System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 400px;
            max-width: 90%;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            color: #34495e;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            color: #555;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            background: #34495e;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #2c3e50;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .demo {
            text-align: center;
            margin-top: 20px;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>


<body>

    <div class="login-box">

        <h1>Student Attendance</h1>

        <h2>Admin Login</h2>


        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            placeholder="Enter username"
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter password"
        >


        <button
            class="login-btn"
            onclick="login()"
        >
            Login
        </button>


        <p
            class="message"
            id="message"
        ></p>


        <p class="demo">
            Demo Login: admin / 1234
        </p>

    </div>


    <script>

        function login() {

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value.trim();

            const message =
                document.getElementById("message");


            if (username === "admin" && password === "1234") {

                localStorage.setItem(
                    "isLoggedIn",
                    "true"
                );

                message.style.color = "green";

                message.textContent =
                    "Login successful!";


                setTimeout(function() {

                    window.location.href =
                        "index.html";

                }, 500);

            } else {

                message.style.color = "red";

                message.textContent =
                    "Invalid username or password!";

            }
        }

    </script>

</body>

</html>
