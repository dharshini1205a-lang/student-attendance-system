<!DOCTYPE html>
<html>
<head>
    <title>Student Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
        }

        .navbar {
            background-color: #343a40;
            color: white;
            padding: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .back-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        .container {
            width: 80%;
            margin: 30px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        input {
            width: 45%;
            padding: 12px;
            margin: 8px;
            box-sizing: border-box;
        }

        .add-btn {
            padding: 12px 25px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        table {
            width: 100%;
            margin-top: 30px;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #007bff;
            color: white;
        }

        .delete-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="navbar">

        <h2>Student Attendance System</h2>

        <button class="back-btn" onclick="goBack()">
            Dashboard
        </button>

    </div>

    <div class="container">

        <h1>Student Management</h1>

        <p style="text-align:center;">
            Add and manage student details
        </p>

        <div style="text-align:center;">

            <input
                type="text"
                id="studentName"
                placeholder="Enter student name"
            >

            <input
                type="text"
                id="rollNumber"
                placeholder="Enter roll number"
            >

            <br>

            <button class="add-btn" onclick="addStudent()">
                Add Student
            </button>

        </div>

        <h2>Student List</h2>

        <table>

            <thead>
                <tr>
                    <th>S.No</th>
                    <th>Student Name</th>
                    <th>Roll Number</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="studentTable">
            </tbody>

        </table>

    </div>

    <script>

        let students = [];

        function addStudent() {

            let name =
                document.getElementById("studentName").value;

            let roll =
                document.getElementById("rollNumber").value;

            if (name === "" || roll === "") {

                alert("Please enter student name and roll number");

                return;
            }

            students.push({
                name: name,
                roll: roll
            });

            displayStudents();

            document.getElementById("studentName").value = "";
            document.getElementById("rollNumber").value = "";
        }

        function displayStudents() {

            let table =
                document.getElementById("studentTable");

            table.innerHTML = "";

            students.forEach(function(student, index) {

                let row = document.createElement("tr");

                row.innerHTML =
                    "<td>" + (index + 1) + "</td>" +
                    "<td>" + student.name + "</td>" +
                    "<td>" + student.roll + "</td>" +
                    "<td>" +
                    "<button class='delete-btn' onclick='deleteStudent(" +
                    index +
                    ")'>Delete</button>" +
                    "</td>";

                table.appendChild(row);

            });
        }

        function deleteStudent(index) {

            students.splice(index, 1);

            displayStudents();
        }

        function goBack() {

            window.location.href = "dashboard.html";

        }

    </script>

</body>
</html>
