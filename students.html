<!DOCTYPE html>
<html>
<head>
    <title>Student Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
        }

        .navbar {
            background-color: #343a40;
            color: white;
            padding: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        .container {
            width: 90%;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #666;
        }

        .form-area {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 30px 0;
        }

        input {
            padding: 12px;
            width: 40%;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .add-btn {
            background-color: #28a745;
            color: white;
        }

        .delete-btn {
            background-color: #dc3545;
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background-color: #007bff;
            color: white;
            padding: 14px;
        }

        td {
            padding: 14px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 20px;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h2>Student Attendance Management System</h2>

        <div>
            <a href="dashboard.html">Dashboard</a>
            <a href="students.html">Students</a>
            <a href="attendance.html">Attendance</a>
            <a href="reports.html">Reports</a>
        </div>
    </div>

    <div class="container">

        <h1>Student Management</h1>

        <p class="subtitle">
            Add and manage student details
        </p>

        <div class="form-area">

            <input
                type="text"
                id="studentName"
                placeholder="Enter student name"
            >

            <input
                type="text"
                id="rollNumber"
                placeholder="Enter roll number"
            >

            <button class="add-btn" onclick="addStudent()">
                Add Student
            </button>

        </div>

        <h2>Student List</h2>

        <table>

            <thead>
                <tr>
                    <th>S.No</th>
                    <th>Student Name</th>
                    <th>Roll Number</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="studentTable">
            </tbody>

        </table>

    </div>


<script>

    // Load students from browser storage
    let students = JSON.parse(localStorage.getItem("students")) || [];


    // Add student
    function addStudent() {

        let name = document
            .getElementById("studentName")
            .value
            .trim();

        let roll = document
            .getElementById("rollNumber")
            .value
            .trim();


        if (name === "" || roll === "") {

            alert("Please enter student name and roll number");

            return;
        }


        // Check duplicate roll number
        let existingStudent = students.find(function(student) {

            return student.roll === roll;

        });


        if (existingStudent) {

            alert("Roll number already exists!");

            return;
        }


        // Add student
        students.push({

            name: name,
            roll: roll

        });


        // IMPORTANT:
        // Save students permanently
        localStorage.setItem(
            "students",
            JSON.stringify(students)
        );


        // Display students
        displayStudents();


        // Clear inputs
        document.getElementById("studentName").value = "";
        document.getElementById("rollNumber").value = "";
    }


    // Display students
    function displayStudents() {

        let table = document.getElementById("studentTable");

        table.innerHTML = "";


        if (students.length === 0) {

            table.innerHTML =
                '<tr><td colspan="4" class="empty">No students found.</td></tr>';

            return;
        }


        students.forEach(function(student, index) {

            let row = document.createElement("tr");


            row.innerHTML =

                "<td>" + (index + 1) + "</td>" +

                "<td>" + student.name + "</td>" +

                "<td>" + student.roll + "</td>" +

                "<td>" +

                '<button class="delete-btn" onclick="deleteStudent(' +
                index +
                ')">Delete</button>' +

                "</td>";


            table.appendChild(row);

        });
    }


    // Delete student
    function deleteStudent(index) {

        if (confirm("Are you sure you want to delete this student?")) {

            students.splice(index, 1);


            // Update localStorage
            localStorage.setItem(
                "students",
                JSON.stringify(students)
            );


            displayStudents();
        }
    }


    // Show students when page opens
    displayStudents();

</script>

</body>
</html>
