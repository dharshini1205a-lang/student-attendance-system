<!DOCTYPE html>
<html>
<head>

    <title>Mark Attendance</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #eaf4ff;
            margin: 0;
        }

        .navbar {
            background-color: #343a40;
            color: white;
            padding: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        .container {
            width: 90%;
            margin: 40px auto;
        }

        h1 {
            text-align: center;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #555;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin-top: 25px;
        }

        .top-area {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        input[type="date"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 11px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .save-btn {
            background-color: #343a70;
            color: white;
        }

        .back-btn {
            background-color: #2864c7;
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: #2196f3;
            color: white;
            padding: 14px;
        }

        td {
            padding: 14px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        select {
            padding: 8px;
            border-radius: 5px;
        }

        .no-students {
            text-align: center;
            padding: 25px;
            color: #777;
        }

    </style>

</head>


<body>

    <div class="navbar">

        <h2>Student Attendance Management System</h2>

        <div>

            <a href="dashboard.html">Dashboard</a>

            <a href="students.html">Students</a>

            <a href="attendance.html">Attendance</a>

            <a href="reports.html">Reports</a>

        </div>

    </div>


    <div class="container">

        <h1>Mark Attendance</h1>

        <p class="subtitle">
            Select the date and mark students as Present or Absent.
        </p>


        <div class="box">

            <div class="top-area">

                <label>
                    <b>Date:</b>
                </label>

                <input
                    type="date"
                    id="attendanceDate"
                >

                <button
                    class="save-btn"
                    onclick="saveAttendance()"
                >
                    Save Attendance
                </button>

                <button
                    class="back-btn"
                    onclick="goBack()"
                >
                    Back to Dashboard
                </button>

            </div>


            <table>

                <thead>

                    <tr>

                        <th>S.No</th>

                        <th>Student Name</th>

                        <th>Roll Number</th>

                        <th>Attendance</th>

                    </tr>

                </thead>


                <tbody id="attendanceTable">

                </tbody>

            </table>

        </div>

    </div>


<script>


    // IMPORTANT:
    // Read the SAME students saved by students.html

    let students =
        JSON.parse(localStorage.getItem("students")) || [];


    // Set today's date
    let today = new Date();

    let year = today.getFullYear();

    let month =
        String(today.getMonth() + 1).padStart(2, "0");

    let day =
        String(today.getDate()).padStart(2, "0");


    document.getElementById("attendanceDate").value =
        year + "-" + month + "-" + day;


    // Display students
    function displayStudents() {

        // Reload latest student data
        students =
            JSON.parse(localStorage.getItem("students")) || [];


        let table =
            document.getElementById("attendanceTable");


        table.innerHTML = "";


        if (students.length === 0) {

            table.innerHTML =

                '<tr>' +

                '<td colspan="4" class="no-students">' +

                'No students found.<br>' +

                'Please add students from the Students page.' +

                '</td>' +

                '</tr>';

            return;
        }


        students.forEach(function(student, index) {


            let row =
                document.createElement("tr");


            row.innerHTML =

                "<td>" +

                (index + 1) +

                "</td>" +


                "<td>" +

                student.name +

                "</td>" +


                "<td>" +

                student.roll +

                "</td>" +


                "<td>" +

                '<select id="status-' +

                index +

                '">' +

                '<option value="Present">Present</option>' +

                '<option value="Absent">Absent</option>' +

                '</select>' +

                "</td>";


            table.appendChild(row);

        });

    }


    // Save attendance
    function saveAttendance() {

        let date =
            document.getElementById("attendanceDate").value;


        if (date === "") {

            alert("Please select a date.");

            return;
        }


        let attendance =
            JSON.parse(
                localStorage.getItem("attendance")
            ) || {};


        if (!attendance[date]) {

            attendance[date] = {};

        }


        students.forEach(function(student, index) {

            let status =
                document.getElementById(
                    "status-" + index
                ).value;


            attendance[date][student.roll] = {

                name: student.name,

                status: status

            };

        });


        // Save attendance permanently
        localStorage.setItem(
            "attendance",
            JSON.stringify(attendance)
        );


        alert("Attendance saved successfully!");


    }


    function goBack() {

        window.location.href =
            "dashboard.html";

    }


    // Display students when page opens
    displayStudents();


</script>

</body>
</html>
